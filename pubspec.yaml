name: pomodoro_app
description: A pixel cute pink Pomodoro app.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/asset-sheet_slices/

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/app-icon.png"
